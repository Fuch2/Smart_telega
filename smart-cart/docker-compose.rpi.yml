services:
  smartcart-ui:
    build:
      context: .
      dockerfile: docker/Dockerfile.rpi
    image: smartcart-ui:local
    container_name: smartcart-ui
    restart: unless-stopped
    working_dir: /data
    network_mode: host
    ipc: host
    privileged: true
    environment:
      DISPLAY: ${DISPLAY:-:0}
      QT_QPA_PLATFORM: ${QT_QPA_PLATFORM:-xcb}
      QT_X11_NO_MITSHM: "1"
      XDG_RUNTIME_DIR: ${XDG_RUNTIME_DIR:-/tmp}
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - /dev:/dev
      - ./runtime:/data
